name: Extractor CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'enhancements/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - 'enhancements/**'
      - 'fix/**'
      - 'feature/**'

permissions:
  contents: read

jobs:
  extractor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Build and unit tests
        run: ./gradlew :timeago-parser:assemble :extractor:assemble :extractor:test --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: extractor-test-report
          retention-days: 7
          path: extractor/build/reports/tests/
          if-no-files-found: ignore
